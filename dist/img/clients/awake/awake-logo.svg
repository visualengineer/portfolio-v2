








<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <defs>
        <style>
        .bg {
            animation-name: bgChange;
            animation-duration: 30s; 
            /* animation-timing-function: ease-in-out;*/
            animation-iteration-count: infinite;
        }

        @keyframes bgChange {
            0%, 20%, 50%, 70%, 100% {
                fill: #FFF;
            }
            25%, 45%, 75%, 95% {
                fill: #2C2626;
            }
        }

        @keyframes awakeChange {
            0%, 20%, 50%, 70%, 100% {
                 fill: #000;
                 opacity: 1;
            }
            25%, 45%, 75%, 95%  {
                fill: #fff;
                opacity: 1;
            }

        }

          .awake-text {
            fill: #26ee2b;
            animation-name: awakeChange;
            animation-duration: 30s; 
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }


        /*svg g { opacity: 0; } .bg { opacity: 0.5; }*/

        @media screen and (max-width: 7000px) {
        .logo  {transform: translate(-3%, 0%);}
        }

        @media screen and (max-width: 1024px) {
        .logo  { transform: scale(1.25) translate(-10%, -8%);}
        }
        @media screen and (max-width: 768px) {
        .logo  {transform: scale(1.35) translate(-14.5%, -10%);}
        /*.bg {transform: scaleY(2) !important;}*/
        }

        </style>




  </defs>
